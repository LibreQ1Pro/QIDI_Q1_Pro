[include gcode_macro.cfg]
[include timelapse.cfg]

# --- Boards and kinematics ---

# Toolhead board (RP2040)
[mcu]
serial: /dev/ttyS2
restart_method: command

# Mainboard (STM32F402)
[mcu U_1]
serial: /dev/ttyS0
restart_method: command

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 8

# --- Axes ---

[stepper_x]
step_pin: U_1:PB4
dir_pin: !U_1:PB3
enable_pin: !U_1:PB5
microsteps: 16
rotation_distance: 39.88
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: -5.5
position_endstop: -5.5
position_max: 246
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: False
step_pulse_duration: 0.0000001

[tmc2240 stepper_x]
cs_pin: U_1:PD2
spi_software_sclk_pin: U_1:PA5
spi_software_mosi_pin: U_1:PA7
spi_software_miso_pin: U_1:PA6
spi_speed: 200000
run_current: 1.07
interpolate: true
stealthchop_threshold: 0
diag0_pin: !U_1:PB8
driver_SGT: 1

[stepper_y]
step_pin: U_1:PC14
dir_pin: !U_1:PC13
enable_pin: !U_1:PC15
microsteps: 16
rotation_distance: 39.88
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -4.5
position_endstop: -4.5
position_max: 258
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: False
step_pulse_duration: 0.0000001

[tmc2240 stepper_y]
cs_pin: U_1:PB9
spi_software_sclk_pin: U_1:PA5
spi_software_mosi_pin: U_1:PA7
spi_software_miso_pin: U_1:PA6
spi_speed: 200000
run_current: 1.07
interpolate: true
stealthchop_threshold: 0
diag0_pin: !U_1:PC0
driver_SGT: 1

[stepper_z]
step_pin: U_1:PC10
dir_pin: U_1:PA15
enable_pin: !U_1:PC11
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 244
position_min: -4
homing_speed: 8
second_homing_speed: 10
homing_retract_dist: 5.0
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2209 stepper_z]
uart_pin: U_1:PC5
run_current: 0.6
interpolate: True
stealthchop_threshold: 9999999999
diag_pin: ^U_1:PC12
driver_SGTHRS: 130

[stepper_z1]
step_pin: U_1:PB1
dir_pin: U_1:PB6
enable_pin: !U_1:PB0
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
step_pulse_duration: 0.0000001

[tmc2209 stepper_z1]
uart_pin: U_1:PB7
run_current: 0.6
interpolate: True
stealthchop_threshold: 9999999999
diag_pin: ^U_1:PA13
driver_SGTHRS: 130

# Bed down to the frame bottom, each Z motor on its own stallguard
[reverse_homing]
steppers: stepper_z, stepper_z1
endstop_pins: tmc2209_stepper_z:virtual_endstop,
    tmc2209_stepper_z1:virtual_endstop
speed: 8

# --- Extruder ---

[extruder]
step_pin: gpio5
dir_pin: gpio4
enable_pin: !gpio10
rotation_distance: 53.7
gear_ratio: 1517:170
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 360
min_extrude_temp: 175
smooth_time: 0.000001
heater_pin: gpio24
sensor_type: MAX6675
sensor_pin: gpio17
spi_speed: 100000
spi_software_sclk_pin: gpio18
spi_software_mosi_pin: gpio19
spi_software_miso_pin: gpio16
max_power: 1

control: pid
pid_Kp: 33.555
pid_Ki: 4.76
pid_Kd: 59.141

pressure_advance: 0.032
pressure_advance_smooth_time: 0.03
max_extrude_cross_section: 500
instantaneous_corner_velocity: 10.000
max_extrude_only_distance: 1000.0
max_extrude_only_velocity: 5000
max_extrude_only_accel: 2000
step_pulse_duration: 0.000002

[tmc2209 extruder]
uart_pin: gpio6
interpolate: True
run_current: 0.714
stealthchop_threshold: 0

# --- Heaters ---

[heater_bed]
heater_pin: U_1:PB10
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: U_1:PA0
max_power: 1.0
control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125
min_temp: -60
max_temp: 125

[heater_generic chamber]
heater_pin: U_1:PC8
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: U_1:PA1

control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125

min_temp: -100
max_temp: 65

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 1

[verify_heater heater_bed]
max_error: 200
check_gain_time: 60
hysteresis: 5
heating_gain: 1

[verify_heater chamber]
max_error: 300
check_gain_time: 480
hysteresis: 5
heating_gain: 1

# --- Fans ---

[fan_generic cooling_fan]
pin: gpio2
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

[fan_generic auxiliary_cooling_fan]
pin: U_1:PA8
shutdown_speed: 0.0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

[fan_generic chamber_circulation_fan]
pin: U_1:PC9
shutdown_speed: 0.0
cycle_time: 0.100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

[heater_fan hotend_fan]
pin: gpio25
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
off_below: 0

# Free fan output on the toolhead board
#[heater_fan hotend_fan2]
#pin: gpio11
#max_power: 1.0
#shutdown_speed: 1.0
#kick_start_time: 0.5
#heater: extruder
#heater_temp: 50.0
#fan_speed: 1.0
#off_below: 0

# Chamber heater fan: while the chamber heats and 60s after
[controller_fan chamber_fan]
pin: U_1:PA4
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
heater: chamber
stepper:
fan_speed: 1.0
off_below: 0
idle_timeout: 60
idle_speed: 1.0

[controller_fan board_fan]
pin: U_1:PC4
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.01
fan_speed: 0.6
stepper: stepper_x,stepper_y

# --- Z probing and bed leveling ---

# Toolhead probe: the stock inductive probe or the MicroProbe below
[probe]
pin: !gpio21
x_offset: 17.6
y_offset: 4.4
z_offset: 1.9
speed: 5
lift_speed: 5
samples: 2
samples_result: average
sample_retract_dist: 5.0
samples_tolerance: 0.05
samples_tolerance_retries: 5

# BIQU MicroProbe on a K3D mount
# Stock nozzles: https://k3d.tech/printers/models/k3d_q1_microprobe_mount_short.stl
# Volcano nozzles: https://k3d.tech/printers/models/k3d_q1_microprobe_mount.stl
# Installation: https://k3d.tech/printers/qidi_q1_pro/#microprobe
#[probe]
#pin: ^!gpio21
#x_offset: 20.0
#y_offset: 4.0
#z_offset: 0.8
#speed: 10
#samples: 1
#sample_retract_dist: 1.0
#deactivate_on_each_sample: False
#activate_gcode:
#    SET_PIN PIN=probe_enable VALUE=0
#    G4 P500
#deactivate_gcode:
#    SET_PIN PIN=probe_enable VALUE=1
#
#[output_pin probe_enable]
#pin: gpio11
#value: 1

# Strain gauges under the bed: the nozzle touch sets the exact Z
[nozzle_touch]
pin: U_1:PC1
z_offset: -0.07
accel: 30
speed: 5
lift_speed: 5
samples: 5
samples_result: median
sample_retract_dist: 5.0
samples_tolerance: 0.05
samples_tolerance_retries: 5
deactivate_on_each_sample: False
activate_gcode:
    _CALIBRATE_BED_STRAIN

[output_pin bed_strain_calibrate]
pin: U_1:PA14
pwm: false
shutdown_value: 0
value: 0

[z_tilt]
z_positions:
    -59,125
    307.5,125

points:
    0,125
    215,125

speed: 150
horizontal_move_z: 5
retries: 2
retry_tolerance: 0.05

[bed_mesh]
speed: 150
horizontal_move_z: 7
mesh_min: 20,15
mesh_max: 230,230
probe_count: 8,8
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
zero_reference_position: 120, 120

# Screws 4 and 5: only for a bed modified to five screws.
[bed_screws]
screw1: 10,10
screw1_name: Front left
screw2: 230,10
screw2_name: Front right
screw3: 125,240
screw3_name: Back center
#screw4: 10,240
#screw4_name: Back left
#screw5: 230,240
#screw5_name: Back right

[screws_tilt_adjust]
screw1: -5,5.6
screw1_name: Front left
screw2: 216,5.6
screw2_name: Front right
screw3: 103,235.6
screw3_name: Back center
#screw4: -5,235.6
#screw4_name: Back left
#screw5: 216,235.6
#screw5_name: Back right

screw_thread: CW-M4

# --- Sensors ---

[temperature_sensor host]
sensor_type: temperature_host

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu
sensor_mcu: U_1

# Used as a runout sensor only
[hall_filament_width_sensor]
adc1: gpio27
adc2: gpio28
cal_dia1: 1.50
cal_dia2: 2.0
raw_dia1: 14397
raw_dia2: 15058
default_nominal_filament_diameter: 1.75
max_difference: 0
measurement_delay: 50
enable: false
measurement_interval: 10
logging: False
min_diameter: 0.3
max_diameter: 100
enable_flow_compensation: False
use_current_dia_while_delay: False
pause_on_runout: True
runout_gcode:
    RESET_FILAMENT_WIDTH_SENSOR
    _XINDI EVENT=filament_runout
event_delay: 3.0
pause_delay: 0.5

# Filament tangle sensor
[filament_switch_sensor fila]
pause_on_runout: True
runout_gcode:
    _XINDI EVENT=filament_tangle
event_delay: 3.0
pause_delay: 0.5
switch_pin: U_1:PC3

[adxl345]
cs_pin: gpio13
spi_software_sclk_pin: gpio14
spi_software_mosi_pin: gpio15
spi_software_miso_pin: gpio12
axes_map: -x, z, -y

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 150
max_smoothing: 0.5
probe_points:
    120, 120, 10

# --- Light and sound ---

[output_pin caselight]
pin: U_1:PC7
pwm: false
shutdown_value: 1
value: 0

[output_pin beeper]
pin: U_1:PA2
pwm: false
shutdown_value: 0
value: 0

# --- Host ---

# SET_KINEMATIC_POSITION for the macros and the display
[force_move]
enable_force_move: true

[save_variables]
filename: /home/mks/printer_data/config/saved_variables.cfg

[respond]
default_type: echo

[idle_timeout]
timeout: 900
gcode:
    TURN_OFF_HEATERS
    M107  # part cooling fan off
    SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    M84  # motors off
    SET_PIN PIN=caselight VALUE=0
    UPDATE_DELAYED_GCODE ID=_LIGHT_AFTER_IDLE DURATION=1

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_arcs]
resolution: 1.0

[exclude_object]
