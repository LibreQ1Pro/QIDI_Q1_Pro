# --- Print ---

# Slicer start G-code: PRINT_START BED= HOTEND= CHAMBER=
[gcode_macro PRINT_START]
gcode:
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.HOTEND|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}
    _SET_ZOFFSET

    M104 S0  # nozzle heater off
    M140 S{bedtemp}  # bed temperature
    G28  # home all axes
    _CLEAR_NOZZLE HOTEND={hotendtemp}

    M190 S{bedtemp}  # bed temperature and wait
    Z_TILT_ADJUST
    G29  # bed mesh
    G0 Z50 F600  # bed down to Z50
    G0 X0 Y0 F6000  # head to the front left corner

    M109 S{hotendtemp}  # nozzle temperature and wait
    M141 S{chambertemp}  # chamber temperature
    M204 S10000  # acceleration 10000
    {% if chambertemp == 0 %}
        M106 P3 S255  # chamber circulation fan full
    {% endif %}
    _ENABLE_ALL_SENSOR

# Slicer end G-code: PRINT_END only
[gcode_macro PRINT_END]
gcode:
    _PRINT_STOP
    {% if printer.extruder.can_extrude %}
        M83  # relative extrusion
        G1 E-3 F1800  # retract 3mm
    {% endif %}
    _PARK
    _PRINT_RESET
    _BEEP I=2 DUR=500

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    _PRINT_STOP
    BASE_CANCEL_PRINT
    _PARK
    _PRINT_RESET
    _BEEP I=2 DUR=500

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(35)|int %}

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

        DISABLE_FILAMENT_WIDTH_SENSOR
        SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        {% if printer.extruder.can_extrude %}
            G92 E0  # extruder position 0
            G1 E-5 F1800  # retract 5mm
        {% endif %}
        {% if (printer.gcode_move.position.z ) < z %}
            G91  # relative coordinates
            G1 Z{z} F900  # bed down by Z
        {% else %}
            G91  # relative coordinates
            G1 Z{5} F900  # bed down 5mm
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK2
        G90  # absolute coordinates
        G1 X97 F9000  # to the wiper at the back
        G1 Y253 F9000
        SAVE_GCODE_STATE NAME=PAUSEPARK
        M104 S0  # nozzle heater off
        SET_IDLE_TIMEOUT TIMEOUT=86400
        SET_STEPPER_ENABLE STEPPER=extruder enable=0
    {% endif %}

# Purge and wipe before going back to the print
[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(5)|int %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M109 S{etemp|int}  # nozzle temperature and wait
        {% endif %}
        M83  # relative extrusion
        G1 X97 F9000  # to the wiper at the back
        G1 Y253 F9000
        G91  # relative coordinates
        G1 E{e} F300  # prime E mm
        G90  # absolute coordinates
        # Wipe the nozzle
        G1 X85 F3000
        G1 X98 F3000
        G1 X85 F3000
        G1 X98 F3000
        G1 X85 F3000
        G1 X98 F3000
        G1 X85 F3000
        G1 X98 F3000
        G1 X85 F3000
        G1 X98 F3000
        G1 X85 F3000
        G1 X98 F3000
        G1 X65 F500
        G1 Y200 F3000  # away from the wiper
        RESTORE_GCODE_STATE NAME=PAUSEPARK2 MOVE=1 MOVE_SPEED=200
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=10
        BASE_RESUME
        ENABLE_FILAMENT_WIDTH_SENSOR
        RESET_FILAMENT_WIDTH_SENSOR
        query_filament_width
        SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
    {% endif %}

# Heaters and fans off before the toolhead moves
[gcode_macro _PRINT_STOP]
gcode:
    _SAVE_ZOFFSET
    M104 S0  # nozzle heater off
    M140 S0  # bed heater off
    M141 S0  # chamber heater off
    M106 P0 S0  # part cooling fan off
    M106 P2 S0  # auxiliary fan off
    M106 P3 S0  # chamber circulation fan off
    M220 S100  # speed 100%
    M221 S100  # flow 100%
    _DISABLE_ALL_SENSOR

# Bed down 3mm (at least to half height), head to the front left
[gcode_macro _PARK]
gcode:
    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set z_max = printer.toolhead.axis_maximum.z %}
        {% set z = printer.gcode_move.gcode_position.z %}
        G90  # absolute coordinates
        G1 Z{[z + 3, z_max]|min} F600  # bed down 3mm
        G1 X0 Y0 F12000  # head to the front left corner
        G1 Z{[[z + 3, z_max / 2 + 10]|max, z_max]|min} F600  # bed down to at least half height
    {% endif %}

[gcode_macro _PRINT_RESET]
gcode:
    M84  # motors off
    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    _XINDI_CLEAR_LAST_FILE

# Purge and wipe at the back, then cool the nozzle down to 140C
[gcode_macro _CLEAR_NOZZLE]
gcode:
    {% set hotendtemp = params.HOTEND|int %}
    {% if (printer.gcode_move.position.z ) < 35 %}
        G1 Z35 F900  # bed down to Z35
    {% else %}
        G91  # relative coordinates
        G1 Z5 F900  # bed down 5mm
        G90  # absolute coordinates
    {% endif %}
    G1 X97 F15000  # to the wiper at the back
    G1 Y243 F15000
    G1 Y254 F800

    M109 S{hotendtemp}  # nozzle temperature and wait

    G92 E0  # extruder position 0
    G1 E80 F400  # purge 80mm
    M106 S255  # part cooling fan full
    M400  # wait for the moves
    M106 P2 S0  # auxiliary fan off
    M104 S0  # nozzle heater off
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp-20}

    # Wipe the nozzle on the brush
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000

    # Slow wipe
    G1 X65 F500
    G1 X88 F500
    G1 X65 F500
    G1 X88 F500
    G1 X65 F500
    G1 X88 F500
    G1 X65 F500
    G1 X88 F500
    G1 X65 F500
    G1 X97 F500

    # Fast wipe
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000
    G1 X85 F2000
    G1 X97 F2000

    M400  # wait for the moves
    _XINDI EVENT=nozzle_cleared
    G1 Y240 F800  # off the wiper
    G1 Y120 F15000  # away from the wiper to cool down
    G1 X230 F15000
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=140
    M107  # part cooling fan off
    M106 P2 S0  # auxiliary fan off
    M400  # wait for the moves
    _XINDI EVENT=nozzle_cooled

[gcode_macro _SET_ZOFFSET]
gcode:
    {% set z = printer.save_variables.variables.z_offset|default(0) %}
    SET_GCODE_OFFSET Z={z} MOVE=0

# Babystep for the next prints.  Only while printing: a second PRINT_END
# would save the offset already reset to 0
[gcode_macro _SAVE_ZOFFSET]
gcode:
    {% set z = printer.gcode_move.homing_origin.z %}
    {% if printer.print_stats.state in ['printing', 'paused'] and z < 0.5 %}
        SAVE_VARIABLE VARIABLE=z_offset VALUE={z}
    {% endif %}

[gcode_macro _ENABLE_ALL_SENSOR]
gcode:
    ENABLE_FILAMENT_WIDTH_SENSOR
    RESET_FILAMENT_WIDTH_SENSOR
    query_filament_width
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1

[gcode_macro _DISABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0
    DISABLE_FILAMENT_WIDTH_SENSOR

# --- Homing and Z ---

[homing_override]
axes: xyz
gcode:
    {% set HOME_CUR = 1 %}
    {% set driver_config = printer.configfile.settings['tmc2240 stepper_x'] %}
    {% set RUN_CUR = driver_config.run_current %}
    {% set HOLD_CUR = driver_config.hold_current %}
    M204 S10000  # acceleration 10000
    M220 S100  # speed 100%
    {% if params.X is defined %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR * 0.7}
        G28 X  # home X
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        _BEEP I=1 DUR=100
        G1 X10 F1200  # away from the X endstop
    {% endif %}

    {% if params.Y is defined %}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR * 0.9}
        G28 Y  # home Y
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        _BEEP I=1 DUR=100
        G1 Y10 F1200  # away from the Y endstop
    {% endif %}

    # Inductive probe, then the nozzle touch at the bed center
    {% if params.Z is defined %}
        G90  # absolute coordinates
        G1 X120 Y120 F7800  # to the bed center
        SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z-5}
        probe samples=2
        SET_KINEMATIC_POSITION Z={printer.configfile.settings.probe.z_offset}
        G1 Z10 F600  # bed to Z10
        NOZZLE_TOUCH SAMPLES=1
        G1 Z30 F480  # bed down to Z30
    {% endif %}

    {% if params.X is undefined and params.Y is undefined and params.Z is undefined %}
        # Lower the bed by up to 7mm, never into the frame
        {% set z_max = printer.toolhead.axis_maximum.z %}
        {% set z_homed = 'z' in printer.toolhead.homed_axes %}
        {% set z_drop = [7, [z_max - printer.toolhead.position.z, 0]|max]|min %}
        {% set z_cur = printer.configfile.settings['tmc2209 stepper_z'].run_current %}
        {% set z1_cur = printer.configfile.settings['tmc2209 stepper_z1'].run_current %}
        SET_KINEMATIC_POSITION X=0
        SET_KINEMATIC_POSITION Y=0
        SET_KINEMATIC_POSITION Z={z_max-10}
        G91  # relative coordinates
        {% if z_homed %}
            G1 Z{z_drop} F600  # bed down
        {% else %}
            SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_cur * 0.8}
            SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z1_cur * 0.8}
            REVERSE_HOMING DISTANCE=7
            SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_cur}
            SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z1_cur}
        {% endif %}
        G1 X10 F2400  # away from the endstops
        G1 Y10 F2400
        G4 P2000  # wait 2s

        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR * 0.8}
        G28 X  # home X
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        _BEEP I=1 DUR=100
        G1 X10 F1200  # away from the X endstop

        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR * 0.9}
        G28 Y  # home Y
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        _BEEP I=1 DUR=100
        G1 Y10 F1200  # away from the Y endstop

        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR * 0.8}
        G28 X  # home X
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        _BEEP I=1 DUR=100
        G1 X10 F1200  # away from the X endstop

        SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z-10}

        G90  # absolute coordinates
        G1 X120 Y120 F7800  # to the bed center
        G91  # relative coordinates
        G28 Z  # home Z with the probe
        G1 Z30 F600  # bed down 30mm
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}
    M204 S10000  # acceleration 10000
    G90  # absolute coordinates

# Exact Z=0 by touching the bed with the nozzle
[gcode_macro _GET_ZOFFSET]
gcode:
    G1 Z10 F600  # bed to Z10
    NOZZLE_TOUCH
    M114  # report the position
    G1 Z30 F600  # bed down to Z30

# Run by NOZZLE_TOUCH.  The board learns the bed motion while the pin is
# set: without the shaking it triggers 0.1-1.4mm above the bed
[gcode_macro _CALIBRATE_BED_STRAIN]
description: Calibrate the strain gauges under the bed to the bed motion
gcode:
    SAVE_GCODE_STATE NAME=calibrate_bed_strain
    G90  # absolute coordinates
    G0 Z1  # bed 1mm below the nozzle
    G91  # relative coordinates
    G4 P3000  # wait 3s
    SET_PIN PIN=bed_strain_calibrate VALUE=1
    # Shake the bed while the board learns
    {% for i in range(6) %}
        G1 Z10 F900
        G1 Z-10 F900
    {% endfor %}
    SET_PIN PIN=bed_strain_calibrate VALUE=0
    G4 P1000  # wait 1s
    RESTORE_GCODE_STATE NAME=calibrate_bed_strain MOVE=1 MOVE_SPEED=10

# Bed mesh for the print (PRINT_START): adaptive or the saved "default"
[gcode_macro G29]
variable_k: 1
gcode:
    BED_MESH_CLEAR
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28  # home all axes
    {% endif %}
    G90  # absolute coordinates
    G1 X120 Y120 F7800  # to the bed center
    _GET_ZOFFSET
    {% if k|int==1 %}
        BED_MESH_CALIBRATE PROFILE=kamp ADAPTIVE=1
    {% else %}
        {% if 'default' in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD=default
        {% else %}
            RESPOND TYPE=echo MSG="No saved bed mesh (AUTO_CALIBRATE saves it), measuring an adaptive mesh"
            BED_MESH_CALIBRATE PROFILE=kamp ADAPTIVE=1
        {% endif %}
    {% endif %}

# G29 mesh mode, set by the display before each print
[gcode_macro _XINDI_MESH_ADAPTIVE]
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

[gcode_macro _XINDI_MESH_SAVED]
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0

# Each Z motor stops on its own: the bed ends parallel to the frame
[gcode_macro _ALIGN_BED_TO_FRAME]
description: Push the bed against the bottom of the frame twice
gcode:
    {% set z_max = printer.toolhead.axis_maximum.z %}
    {% set z_cur = printer.configfile.settings['tmc2209 stepper_z'].run_current %}
    {% set z1_cur = printer.configfile.settings['tmc2209 stepper_z1'].run_current %}
    G90  # absolute coordinates
    G1 Z{z_max - 30} F600  # bed 30mm above the frame bottom
    {% for i in range(2) %}
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_cur * 0.8}
        SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z1_cur * 0.8}
        REVERSE_HOMING
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_cur}
        SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z1_cur}
        G1 Z{z_max - 30} F600  # bed 30mm above the frame bottom
    {% endfor %}

# --- Calibrations started from the display ---

# The _XINDI events advance the display progress pages.  M4028: G28 and the
# exact Z (stock display command)
[gcode_macro M4028]
gcode:
    G28  # home all axes
    _GET_ZOFFSET
    M400  # wait for the moves
    _XINDI EVENT=homed

[gcode_macro AUTO_CALIBRATE]
description: Measure the Z offset and the bed mesh at temperature BED
gcode:
    {% set bed = params.BED|default(printer.heater_bed.target)|int %}
    M140 S{bed}  # bed temperature
    M104 S140  # nozzle to 140C
    SAVE_VARIABLE VARIABLE=z_offset VALUE=0
    G28  # home all axes
    M400  # wait for the moves
    _XINDI EVENT=homed
    _CLEAR_NOZZLE HOTEND=240
    M190 S{bed}  # bed temperature and wait
    G28  # home all axes
    Z_TILT_ADJUST
    # Z_TILT_ADJUST moves Z
    G28  # home all axes
    _GET_ZOFFSET
    SET_GCODE_OFFSET Z=0 MOVE=1
    BED_MESH_CALIBRATE
    G0 Z50 F600  # bed down to Z50
    G0 X0 Y0 F9000  # head to the front left corner
    M400  # wait for the moves
    _TURN_OFF_HEATERS_BEFORE_RESTART
    _XINDI EVENT=bed_mesh_done
    SAVE_CONFIG

# Followed by BED_SCREWS_ADJUST from the display.  REVERSE_HOMING leaves an
# approximate Z, hence the G28
[gcode_macro BED_SCREWS_PREPARE]
description: Align the bed with the frame, nozzle to Z=0 at the center
gcode:
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0 MOVE=0
    G28  # home all axes
    _ALIGN_BED_TO_FRAME
    G28  # home all axes
    _GET_ZOFFSET
    G1 X120 Y120 F9000  # to the bed center
    G1 Z0 F600  # nozzle on the bed

[gcode_macro UNBOXING_PREPARE]
description: Align the bed with the frame after unboxing
gcode:
    G28  # home all axes
    _ALIGN_BED_TO_FRAME
    G28  # home all axes
    G90  # absolute coordinates
    G1 Z20 F600  # bed down to Z20

[gcode_macro INPUT_SHAPER_CALIBRATE]
description: Measure the resonances and save the input shapers
gcode:
    G28  # home all axes
    SHAPER_CALIBRATE
    M400  # wait for the moves
    _TURN_OFF_HEATERS_BEFORE_RESTART
    _XINDI EVENT=input_shaping_done
    SAVE_CONFIG

[gcode_macro SHAPER_CALIBRATE]
rename_existing: RESHAPER_CALIBRATE
gcode:
    RESHAPER_CALIBRATE FREQ_START=20 FREQ_END=150

# A heater at low power goes off up to ~3s later: SAVE_CONFIG restarting
# before that shuts the MCU down
[gcode_macro _TURN_OFF_HEATERS_BEFORE_RESTART]
gcode:
    TURN_OFF_HEATERS
    G4 P4000  # wait 4s

# --- Standard G-code and M-code commands ---

# Stop: pause the print
[gcode_macro M0]
gcode:
    PAUSE

# Pause the print
[gcode_macro M25]
rename_existing: M9925
gcode:
    PAUSE

# Fan speed: P0 part fan, P2 auxiliary fan, P3 chamber circulation fan
[gcode_macro M106]
gcode:
    {% set p = params.P|default(0)|int %}

    {% if p == 2 %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1
        {% endif %}
    {% endif %}

    {% if p == 0 %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=cooling_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=1
        {% endif %}
    {% endif %}

    {% if p == 3 %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=1
        {% endif %}
    {% endif %}

# Part cooling fan off
[gcode_macro M107]
gcode:
    SET_FAN_SPEED FAN=cooling_fan SPEED=0

# Nozzle temperature and wait for target..target+1 (also after an
# overshoot)
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  # nozzle temperature
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

# Chamber temperature, limited to 60C
[gcode_macro M141]
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|float %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={([s, 60]|min)}
    {% endif %}

# Chamber temperature and wait for it (2C below is enough)
[gcode_macro M191]
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|float %}

        M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  # chamber temperature
        {% if s != 0 %}
            TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={([s, 60]|min)-2}
        {% endif %}
    {% endif %}

# Babystep: move Z by Z=<mm>
[gcode_macro M290]
gcode:
    SET_GCODE_OFFSET Z_ADJUST={params.Z}

# PID calibration: E-1 bed, E0 nozzle, S=<temperature>
[gcode_macro M303]
gcode:
    {% if params.E is defined %}
        {% if params.S is defined %}
            {% if (params.E|int)==-1 %}
                PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
            {% endif %}
            {% if (params.E|int)==0 %}
                PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
            {% endif %}
        {% endif %}
    {% endif %}

# Filament unload from the display (it heats the nozzle first)
[gcode_macro M603]
description: unload filament
gcode:
    _XINDI EVENT=filament_heated
    G92 E0  # extruder position 0
    G0 E15 F400  # extrude 15mm to soften the tip
    G4 P1000  # wait 1s
    G92 E0  # extruder position 0
    G1 E-90 F800  # pull the filament out
    M400  # wait for the moves
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    _XINDI EVENT=filament_unloaded

# Filament load from the display (it heats the nozzle first)
[gcode_macro M604]
description: load filament
gcode:
    _XINDI EVENT=filament_heated
    M83  # relative extrusion
    G1 E80 F400  # feed 80mm
    M400  # wait for the moves
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    _XINDI EVENT=filament_loaded

# Filament width sensor: D1 on, D0 off
[gcode_macro M8029]
gcode:
    {% if params.D is defined %}
        {% if (params.D|int)==1 %}
            ENABLE_FILAMENT_WIDTH_SENSOR
        {% endif %}
        {% if (params.D|int)==0 %}
            DISABLE_FILAMENT_WIDTH_SENSOR
        {% endif %}
    {% endif %}

# Pressure advance: K=<advance>, T=<smooth time>
[gcode_macro M900]
gcode:
    {% if params.K is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
    {% if params.T is defined %}
        SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
    {% endif %}

# --- Display (xindi) ---

# Display events: "// action:xindi <event>"
[gcode_macro _XINDI]
description: Report an event to the display
gcode:
    RESPOND TYPE=command MSG="action:xindi {params.EVENT}"

# No power loss resume yet: stubs for the display, LOG_Z for the slicer
[gcode_macro _XINDI_DETECT_INTERRUPTION]
gcode:

[gcode_macro _XINDI_RESUME_INTERRUPTED]
gcode:
    RESPOND TYPE=error MSG="Power loss resume is not supported"

[gcode_macro _XINDI_CLEAR_LAST_FILE]
gcode:
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False

[gcode_macro LOG_Z]
gcode:

[gcode_macro beep_on]
gcode:
    _SOUND ENABLED=1

[gcode_macro beep_off]
gcode:
    _SOUND ENABLED=0

# Display sound setting, kept in saved_variables.cfg
[gcode_macro _SOUND]
variable_enabled: 0
gcode:
    {% set enabled = params.ENABLED|int %}
    SET_GCODE_VARIABLE MACRO=_SOUND VARIABLE=enabled VALUE={enabled}
    SAVE_VARIABLE VARIABLE=sound VALUE={enabled}

[gcode_macro _BEEP]
gcode:
    {% set i = params.I|default(1)|int %}
    {% set dur = params.DUR|default(100)|int %}

    {% if printer["gcode_macro _SOUND"].enabled %}
        {% for iteration in range(i|int) %}
            SET_PIN PIN=beeper VALUE=1
            G4 P{dur}  # beep length
            SET_PIN PIN=beeper VALUE=0
            G4 P{dur}  # pause between beeps
        {% endfor %}
    {% endif %}

[gcode_macro light_on]
gcode:
    SAVE_VARIABLE VARIABLE=light VALUE=1
    _LIGHT_APPLY

[gcode_macro light_off]
gcode:
    SAVE_VARIABLE VARIABLE=light VALUE=0
    _LIGHT_APPLY

[gcode_macro _LIGHT_APPLY]
gcode:
    {% set want = printer.save_variables.variables.light|default(1)|int %}
    {% if printer.output_pin.caselight.value|int != want %}
        SET_PIN PIN=caselight VALUE={want}
    {% endif %}

[delayed_gcode _LIGHT_AFTER_IDLE]
gcode:
    {% if printer.idle_timeout.state == "Idle" %}
        UPDATE_DELAYED_GCODE ID=_LIGHT_AFTER_IDLE DURATION=1
    {% else %}
        _LIGHT_APPLY
    {% endif %}

# --- Startup ---

[delayed_gcode PRINTER_INIT]
initial_duration: 0.2
gcode:
    BED_MESH_CLEAR
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0
    SET_GCODE_VARIABLE MACRO=_SOUND VARIABLE=enabled VALUE={printer.save_variables.variables.sound|default(0)}
    _LIGHT_APPLY
    # Starts the idle timeout countdown
    G4 P1
